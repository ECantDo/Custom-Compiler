# Register file description for the RISC-V-like target.
#
# Consumed by the compiler's register allocator
# (src/compiler/register_allocation/config.rs).
#
# One register per line:
#
#     <name>   <class> [<class> ...]
#
# `#` starts a comment (whole-line or trailing). Blank lines are ignored.
# Register order in this file is significant: `arg` registers are handed
# out in the order they appear here, and that same order is the colouring
# preference for the allocatable pool.
#
# Classes
# -------
#   zero      hard-wired zero. Never allocated, never saved.
#   reserved  owned by the ABI / runtime (sp, ra, gp, tp). Never allocated.
#   arg       carries an incoming/outgoing argument. N-th `arg` line == aN.
#   ret       carries a return value.
#   caller    caller-saved / volatile: free to clobber across a call.
#             Part of the allocatable pool.
#   callee    callee-saved: a function must preserve it across its body.
#             Part of the allocatable pool.
#
# The allocatable pool is every register tagged `caller` or `callee`.
# `arg` / `ret` may be combined with a save class once calls are wired up
# (e.g. `a0  arg ret caller`).
#
# NOTE: right now there is no stack management (no sp spill/save), so the
# whole pool is parked in `callee` and the `a*` registers are kept out of
# the pool entirely - nothing may land in an argument register across a
# call while there is nowhere to save it. Revisit when SP handling lands.

zero   zero
ra     reserved
sp     reserved
gp     reserved
tp     reserved

a0     arg ret
a1     arg ret
a2     arg
a3     arg
a4     arg
a5     arg
a6     arg
a7     arg

s0     callee
s1     callee
s2     callee
s3     callee
s4     callee
s5     callee
s6     callee
s7     callee
s8     callee
s9     callee
s10    callee
s11    callee

t0     callee
t1     callee
t2     callee
t3     callee
t4     callee
t5     callee
t6     callee
